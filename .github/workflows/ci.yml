name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # The public key renders the feedback form in the export so the form's
      # client-side validation (P13) and keyboard tests can run.
      NEXT_PUBLIC_WEB3FORMS_KEY: test-access-key
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.9.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content check and lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Static export
        run: npm run build

      - name: Playwright E2E suite
        run: npx playwright install chromium && npm run test:e2e

      - name: Post-build smoke checks
        run: npm run smoke
