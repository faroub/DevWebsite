name: CI

on:
  push:
    branches: [main, remediation-run-2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository tracked files
        run: npm run check-tracked

      - name: Content check and lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Static export
        run: npm run build

      - name: Playwright E2E suite
        run: npx playwright install chromium && npx playwright test

      - name: Post-build smoke checks
        run: npm run smoke
